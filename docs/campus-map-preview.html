function el(tag, attrs){ const n=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const k in attrs) if(attrs[k]!==undefined && attrs[k]!==null) n.setAttribute(k, attrs[k]); return n; }
const up=(p,dy)=>({x:p.x,y:p.y-dy}), mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const depthOf=(tx,ty,tw,th)=>tx+tw/2+(ty+th/2);

const svg = document.getElementById('map');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

// ── defs：纹理 pattern ──
const defs = el('defs', {});
defs.innerHTML = `
  <pattern id="tex-grass" width="14" height="14" patternUnits="userSpaceOnUse">
    <path d="M3 9 q1.5 -3 3 0" fill="none" stroke="#a9cd97" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M9 4 q1.5 -3 3 0" fill="none" stroke="#b9dba8" stroke-width="1" stroke-linecap="round"/>
  </pattern>
  <pattern id="tex-pebble" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="5" r="1.5" fill="#c9b28c" opacity=".85"/>
    <circle cx="11" cy="10" r="1.2" fill="#d8c4a2" opacity=".8"/>
    <circle cx="7" cy="13" r="1" fill="#bfa77f" opacity=".7"/>
  </pattern>
  <pattern id="tex-ripple" width="26" height="14" patternUnits="userSpaceOnUse">
    <path d="M0 7 q6 -3 13 0 q6 3 13 0" fill="none" stroke="#d6f0f7" stroke-width="1.3" opacity=".9"/>
    <path d="M0 12 q6 -3 13 0" fill="none" stroke="#bfe4f0" stroke-width="1" opacity=".7"/>
  </pattern>
  <pattern id="tex-tile" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M0 0 L22 0 M0 0 L0 22" stroke="#cfc9bd" stroke-width="1" opacity=".8"/>
  </pattern>
  <pattern id="tex-track" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M0 15 L30 15" stroke="#f2f5f7" stroke-width="1.4" opacity=".5"/>
  </pattern>
  <pattern id="tex-grain" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1" fill="#e2d0aa"/><circle cx="8" cy="9" r="1.2" fill="#ddc99f"/>
  </pattern>
  <pattern id="tex-grid" width="${TILE_W/2}" height="${TILE_H/2}" patternUnits="userSpaceOnUse">
    <path d="M0 0 L${TILE_W/2} ${TILE_H/4} L0 ${TILE_H/2} L${-TILE_W/2} ${TILE_H/4} Z" fill="none" stroke="#6b7280" stroke-opacity=".18" stroke-width=".7"/>
  </pattern>`;
svg.appendChild(defs);

const bg = el('rect', { x:0, y:0, width:W, height:H, fill:'#f4f1e8' });
svg.appendChild(bg);
const world = el('g', {}); svg.appendChild(world);
const gridPath = el('path', { fill:'url(#tex-grid)', display:'none' }); world.appendChild(gridPath);

// ── 地面 ──
function ground(o){
  const st = GROUND[o.variant] || GROUND.grass;
  const seed = Number((o.props||{}).seed ?? 7);
  const corners = quad(o.tx,o.ty,o.tw,o.th);
  const d = wobblyPolygon(corners, seed, o.tw>12?2.2:1.4);
  const g = el('g', {});
  g.appendChild(el('path', { d, fill: st.fill, stroke: st.edge, 'stroke-width': 1.2, 'stroke-linejoin':'round' }));
  g.appendChild(el('path', { d, fill:`url(#tex-${st.tex})`, opacity:.85 }));
  if (o.variant === 'field_track') {
    g.appendChild(el('path', { d: pathOf(quad(o.tx+.7,o.ty+.7,o.tw-1.4,o.th-1.4)), fill:'#cfe0b4', stroke:'#f2f5f7', 'stroke-width':3, 'stroke-linejoin':'round' }));
  }
  return g;
}

// ── 建筑（三面体）──
function building(o){
  const st = BUILDING[o.variant] || BUILDING.main;
  const h = (o.height||0)*WALL_UNIT, seed = Number((o.props||{}).seed ?? 5);
  const [n,e,s,w] = quad(o.tx,o.ty,o.tw,o.th);
  const nh=up(n,h), eh=up(e,h), sh=up(s,h), wh=up(w,h);
  const g = el('g', {});
  g.appendChild(el('path', { d: pathOf([n,e,s,w]), fill:'#64748b', opacity:.16, transform:'translate(3 5)' }));
  g.appendChild(el('path', { d: pathOf([w,s,sh,wh]), fill: st.left }));
  g.appendChild(el('path', { d: pathOf([s,e,eh,sh]), fill: st.right }));
  g.appendChild(el('path', { d: `M${wh.x} ${wh.y} L${sh.x} ${sh.y} L${eh.x} ${eh.y}`, fill:'none', stroke: st.trim, 'stroke-width':2, opacity:.7 }));
  const floors = Math.max(1, Math.round(o.height||0));
  for(let i=1;i<floors;i++){ const dy=h*i/floors;
    g.appendChild(el('path',{ d:`M${up(w,dy).x} ${up(w,dy).y} L${up(s,dy).x} ${up(s,dy).y}`, stroke:'#000', 'stroke-opacity':.06, 'stroke-width':1, fill:'none' }));
  }
  const rnd = seeded(seed);
  const winCols = Math.max(1, Math.round(o.tw/1.6));
  for(let i=0;i<winCols;i++){
    const t0=(i+.3)/winCols, t1=(i+.7)/winCols;
    for(let f=0; f<Math.max(1,floors-1); f++){
      const off0 = -h*(f+.3)/floors, off1 = -h*(f+.72)/floors;
      const p = [ {x:w.x+(s.x-w.x)*t0, y:w.y+(s.y-w.y)*t0+off0},
                  {x:w.x+(s.x-w.x)*t1, y:w.y+(s.y-w.y)*t1+off0},
                  {x:w.x+(s.x-w.x)*t1, y:w.y+(s.y-w.y)*t1+off1},
                  {x:w.x+(s.x-w.x)*t0, y:w.y+(s.y-w.y)*t0+off1} ];
      g.appendChild(el('path', { d: pathOf(p), fill:'#e8f1fb', opacity:.55+rnd()*.25, stroke:'#b9cfe4', 'stroke-width':.6 }));
    }
  }
  const m1=mid(n,e), m2=mid(w,s), lift=h*.42;
  if (st.kind === 'gable') {
    const m1h=up(m1,lift), m2h=up(m2,lift);
    g.appendChild(el('path', { d: pathOf([n,m1,m1h,m2h,m2,w]), fill: st.roof }));
    g.appendChild(el('path', { d: pathOf([m1,e,s,m2,m2h,m1h]), fill: st.roofEdge }));
    g.appendChild(el('path', { d: `M${wh.x} ${wh.y} L${m2h.x} ${m2h.y} L${m1h.x} ${m1h.y} L${eh.x} ${eh.y}`, fill:'none', stroke: st.trim, 'stroke-width':2, opacity:.85 }));
  } else {
    g.appendChild(el('path', { d: pathOf([w,s,e,n]), fill: st.roof }));
    g.appendChild(el('path', { d: pathOf([wh,sh,eh,nh]), fill: st.roof, stroke: st.roofEdge, 'stroke-width':1.4 }));
    g.appendChild(el('path', { d: pathOf([
      {x:wh.x+(sh.x-wh.x)*.3, y:wh.y+(sh.y-wh.y)*.3-6},
      {x:nh.x+(eh.x-nh.x)*.55, y:nh.y+(eh.y-nh.y)*.55-6},
      {x:nh.x+(eh.x-nh.x)*.55, y:nh.y+(eh.y-nh.y)*.55-1},
      {x:wh.x+(sh.x-wh.x)*.3, y:wh.y+(sh.y-wh.y)*.3-1} ]), fill:'#fff', opacity:.38 }));
  }
  return g;
}

// ── 摆件 ──
function prop(o){
  const seed = Number((o.props||{}).seed ?? 3), rnd = seeded(seed);
  const p = toScreen(o.tx+o.tw/2, o.ty+o.th/2);
  const g = el('g', {});
  const shadow = el('ellipse', { cx:p.x+2, cy:p.y+3, rx:13*(o.tw/1.4), ry:5, fill:'#64748b', opacity:.16 });
  const T = '#b08462', TL='#8fc98f', TL2='#a6d8a0', PL='#7bb98a', PL2='#93c99f';
  switch(o.variant){
    case 'tree':
      g.appendChild(shadow);
      g.appendChild(el('rect',{x:p.x-2.6,y:p.y-12,width:5.2,height:13,rx:2.4,fill:T}));
      g.appendChild(el('circle',{cx:p.x,cy:p.y-26,r:14.5,fill:TL}));
      g.appendChild(el('circle',{cx:p.x+8,cy:p.y-32,r:10,fill:TL2}));
      g.appendChild(el('circle',{cx:p.x-8,cy:p.y-30,r:9,fill:TL2,opacity:.9}));
      break;
    case 'pine': {
      const h=30+rnd()*8;
      g.appendChild(shadow);
      g.appendChild(el('rect',{x:p.x-2.4,y:p.y-10,width:4.8,height:11,rx:2,fill:T}));
      g.appendChild(el('path',{d:pathOf([{x:p.x,y:p.y-h-14},{x:p.x+12,y:p.y-h*.55},{x:p.x-12,y:p.y-h*.55}]),fill:PL}));
      g.appendChild(el('path',{d:pathOf([{x:p.x,y:p.y-h},{x:p.x+14,y:p.y-h*.3},{x:p.x-14,y:p.y-h*.3}]),fill:PL2}));
      break;
    }
    case 'rock':
      g.appendChild(shadow);
      g.appendChild(el('path',{d:pathOf([{x:p.x-9,y:p.y+2},{x:p.x-6,y:p.y-7},{x:p.x+1,y:p.y-10},{x:p.x+8,y:p.y-4},{x:p.x+9,y:p.y+2}]),fill:'#c3c8cf',stroke:'#a9b0b8','stroke-width':.8}));
      g.appendChild(el('path',{d:pathOf([{x:p.x-6,y:p.y-7},{x:p.x+1,y:p.y-10},{x:p.x+2,y:p.y-5}]),fill:'#d7dade',opacity:.9}));
      break;
    case 'bench': {
      const bw=o.tw*TILE_W*.42, hh=9;
      const a={x:p.x-bw/2,y:p.y}, b={x:p.x+bw/2,y:p.y-(bw/2)*(TILE_H/TILE_W)},
            c={x:p.x+bw/2,y:p.y+(bw/2)*(TILE_H/TILE_W)}, d={x:p.x-bw/2,y:p.y};
      g.appendChild(el('ellipse',{cx:p.x,cy:p.y+4,rx:bw*.55,ry:4.5,fill:'#64748b',opacity:.16}));
      g.appendChild(el('path',{d:pathOf([a,b,c,d]),fill:'#dcbe9a'}));
      g.appendChild(el('path',{d:pathOf([a,d,{x:d.x,y:d.y+hh},{x:a.x,y:a.y+hh}]),fill:'#c9a882'}));
      g.appendChild(el('path',{d:pathOf([d,c,{x:c.x,y:c.y+hh},{x:d.x,y:d.y+hh}]),fill:'#a98962',opacity:.9}));
      g.appendChild(el('path',{d:`M${b.x} ${b.y-9} L${c.x} ${c.y-9} L${d.x} ${d.y-9}`,fill:'none',stroke:'#dcbe9a','stroke-width':3,'stroke-linecap':'round'}));
      break;
    }
    case 'lamp':
      g.appendChild(shadow);
      g.appendChild(el('rect',{x:p.x-1.6,y:p.y-26,width:3.2,height:27,rx:1.6,fill:'#a8aab0'}));
      g.appendChild(el('circle',{cx:p.x,cy:p.y-29,r:7,fill:'#ffe9a8',opacity:.95}));
      g.appendChild(el('circle',{cx:p.x,cy:p.y-29,r:4.5,fill:'#fff8dc'}));
      break;
    case 'flower': {
      const cs=['#f2b8c6','#f6d68f','#c9b6e8'];
      for(let i=0;i<6;i++){ const a2=(i/6)*Math.PI*2+rnd(), rr=5+rnd()*7;
        g.appendChild(el('circle',{cx:p.x+Math.cos(a2)*rr, cy:p.y+Math.sin(a2)*rr*.5, r:2.6, fill:cs[i%3]})); }
      break;
    }
    case 'board':
      g.appendChild(shadow);
      g.appendChild(el('rect',{x:p.x-13,y:p.y-26,width:26,height:17,rx:2.5,fill:'#f5efe2',stroke:'#c8ab86','stroke-width':2}));
      g.appendChild(el('path',{d:`M${p.x-9} ${p.y-21} L${p.x+9} ${p.y-21}`,stroke:'#cfc7b6','stroke-width':1.4}));
      g.appendChild(el('path',{d:`M${p.x-9} ${p.y-17} L${p.x+4} ${p.y-17}`,stroke:'#cfc7b6','stroke-width':1.4}));
      g.appendChild(el('rect',{x:p.x-12,y:p.y-9,width:3,height:10,rx:1.4,fill:'#c8ab86'}));
      g.appendChild(el('rect',{x:p.x+9,y:p.y-9,width:3,height:10,rx:1.4,fill:'#c8ab86'}));
      break;
  }
  return g;
}

// 按 layer + 深度排序（等距遮挡）
const ordered = MAP.objects.slice().sort((a,b)=>{
  const la=a.layer||0, lb=b.layer||0;
  if(la!==lb) return la-lb;
  return depthOf(a.tx,a.ty,a.tw,a.th) - depthOf(b.tx,b.ty,b.tw,b.th);
});

gridPath.setAttribute('d', pathOf([toScreen(0,0),toScreen(cols,0),toScreen(cols,rows),toScreen(0,rows)]));

const content = el('g', {});
world.appendChild(content);
for (const o of ordered) {
  content.appendChild(o.kind === 'ground' ? ground(o) : o.kind === 'building' ? building(o) : prop(o));
}

// 地点名牌
for (const o of MAP.objects) {
  if (o.kind !== 'building' || !o.name) continue;
  const c = toScreen(o.tx + o.tw/2, o.ty + o.th/2);
  const t = el('text', { x: c.x, y: c.y - (o.height||0)*WALL_UNIT - 26, 'text-anchor':'middle',
    'font-size':13, fill:'#374151', 'font-weight':600, stroke:'#fff', 'stroke-width':3.5,
    'paint-order':'stroke', style:'pointer-events:none' });
  t.textContent = o.name;
  content.appendChild(t);
}

document.getElementById('count').textContent =
  `${MAP.objects.length} 个对象（${MAP.objects.filter(o=>o.kind==='ground').length} 地面 / ${MAP.objects.filter(o=>o.kind==='building').length} 建筑 / ${MAP.objects.filter(o=>o.kind==='prop').length} 摆件）`;

// ── 视口交互 ──
let zoom = 1, panX = 0, panY = 0;
function apply(){ world.setAttribute('transform', `translate(${panX} ${panY}) scale(${zoom})`); }
function fit(){ zoom = 1; panX = 0; panY = 0; apply(); document.getElementById('fit').classList.add('on');
  setTimeout(()=>document.getElementById('fit').classList.remove('on'), 400); }

function clientToWorld(cx, cy){
  const m = svg.getScreenCTM(); if(!m) return null;
  const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
  const vb = pt.matrixTransform(m.inverse());
  return { x: (vb.x - panX)/zoom, y: (vb.y - panY)/zoom };
}

svg.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const wpt = clientToWorld(e.clientX, e.clientY); if(!wpt) return;
  const f = e.deltaY > 0 ? 0.9 : 1.1;
  const nz = Math.max(0.35, Math.min(3.5, zoom*f));
  const sx = wpt.x*zoom + panX, sy = wpt.y*zoom + panY;
  zoom = nz; panX = sx - wpt.x*nz; panY = sy - wpt.y*nz; apply();
}, { passive: false });

let pan = null;
svg.addEventListener('pointerdown', (e)=>{ pan={cx:e.clientX, cy:e.clientY, px:panX, py:panY}; svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove', (e)=>{ if(!pan) return;
  panX = pan.px + (e.clientX-pan.cx); panY = pan.py + (e.clientY-pan.cy); apply(); });
svg.addEventListener('pointerup', ()=>{ pan=null; });
svg.addEventListener('pointerleave', ()=>{ pan=null; });

document.getElementById('fit').addEventListener('click', fit);
document.getElementById('zi').addEventListener('click', ()=>{ zoom=Math.min(3.5, zoom*1.15); apply(); });
document.getElementById('zz').addEventListener('click', ()=>{ zoom=Math.max(.35, zoom/1.15); apply(); });
document.getElementById('grid').addEventListener('click', (e)=>{
  const on = gridPath.getAttribute('display') === 'none';
  gridPath.setAttribute('display', on ? 'inline' : 'none');
  e.currentTarget.classList.toggle('on', on);
});
apply();
</script>
</body>
</html>
